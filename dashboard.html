<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Dashboard</title>
    <style>
        :root {
            --gap: 10px;
        }

        /* --- LOCK SCROLL (NO VERTICAL SCROLL) --- */
        html, body {
            overflow: hidden !important;
            height: 100% !important;
            max-height: 100% !important;
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 8px 10px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            direction: ltr;
            box-sizing: border-box;
        }

        /* --- HIDE SCROLLBAR --- */
        ::-webkit-scrollbar {
            display: none;
        }

        /* For Firefox */
        html {
            scrollbar-width: none;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: fit-content;
        }

        .row {
            display: flex;
            gap: var(--gap);
            justify-content: center;
        }

        /* Виджеты в iframe */
        iframe {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            display: block;
            background: transparent;
        }

        /* Размеры для iframe */
        .wide-widget {
            width: 330px;
            height: 160px;
        }

        .small-widget {
            width: 160px;
            height: 160px;
        }

        .large-stream-widget {
            width: 330px;
            height: 380px;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <!-- 1. Широкая погода -->
        <div class="row">
            <iframe src="widgets/weather_wide.html" class="wide-widget" scrolling="no" loading="lazy"></iframe>
        </div>

        <!-- 2. Широкие часы -->
        <div class="row">
            <iframe src="widgets/clock_wide.html" class="wide-widget" scrolling="no" loading="lazy"></iframe>
        </div>

        <!-- 3. Два маленьких виджета (Маленькие часы и Маленькая погода) -->
        <!--<div class="row">
            <iframe src="widgets/clock_small.html" class="small-widget" scrolling="no" loading="lazy"></iframe>
            <iframe src="widgets/weather_small.html" class="small-widget" scrolling="no" loading="lazy"></iframe>
        </div>-->

        <!-- 4. Twitch -->
        <div class="row">
            <iframe src="widgets/twitch.html" class="large-stream-widget" scrolling="no" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Передача событий колесика мыши родительскому окну (home.html)
        // Любой скролл вниз или вправо возвращает обратно на экран приложений
        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 5 || e.deltaX > 5) {
                try {
                    window.parent.postMessage({ type: 'iphone_navigate_page', direction: 1 }, '*');
                } catch (err) {}
            }
        }, { passive: true });
    </script>
</body>

</html>
