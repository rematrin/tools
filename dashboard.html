<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Dashboard</title>
    <style>
        :root {
            --gap: 10px;
        }

        /* Вертикальная прокрутка нужна внутри страницы виджетов телефона. */
        html, body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            height: 100% !important;
            max-height: 100% !important;
            overscroll-behavior-y: contain;
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 8px 10px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            direction: ltr;
            box-sizing: border-box;
        }

        /* --- HIDE SCROLLBAR --- */
        ::-webkit-scrollbar {
            display: none;
        }

        /* For Firefox */
        html {
            scrollbar-width: none;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: fit-content;
        }

        .row {
            display: flex;
            gap: var(--gap);
            justify-content: center;
        }

        /* Виджеты в iframe */
        iframe {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            display: block;
            background: transparent;
        }

        /* Размеры для iframe */
        .wide-widget {
            width: 330px;
            height: 160px;
        }

        .small-widget {
            width: 160px;
            height: 160px;
        }

        .large-stream-widget {
            width: 330px;
            height: 380px;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <!-- 1. Широкая погода -->
        <div class="row">
            <iframe src="widgets/weather_wide.html" class="wide-widget" scrolling="no" loading="lazy"></iframe>
        </div>

        <!-- 2. Широкие часы -->
        <div class="row">
            <iframe src="widgets/clock_wide.html" class="wide-widget" scrolling="no" loading="lazy"></iframe>
        </div>

        <!-- 3. Два маленьких виджета (Маленькие часы и Маленькая погода) -->
        <!--<div class="row">
            <iframe src="widgets/clock_small.html" class="small-widget" scrolling="no" loading="lazy"></iframe>
            <iframe src="widgets/weather_small.html" class="small-widget" scrolling="no" loading="lazy"></iframe>
        </div>-->

        <!-- 4. Twitch -->
        <div class="row">
            <iframe src="widgets/twitch.html" class="large-stream-widget" scrolling="no" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Вертикальное колесо прокручивает виджеты; горизонтальное листает страницы телефона.
        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && e.deltaX > 5) {
                try {
                    window.parent.postMessage({ type: 'iphone_navigate_page', direction: 1 }, '*');
                } catch (err) {}
            }
        }, { passive: true });

        // Пересылка событий свайпа от внутренних виджетов в home.html
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type && e.data.type.startsWith('iphone_widget_drag_')) {
                try {
                    window.parent.postMessage(e.data, '*');
                } catch (err) {}
            }
        });

        // Свайп курсором мыши по свободному фону дашборда
        (function initDashboardDrag() {
            let startX = 0, startY = 0, isDragging = false;

            window.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                startX = e.screenX;
                startY = e.screenY;
                isDragging = true;
                try {
                    window.parent.postMessage({ type: 'iphone_widget_drag_start', screenX: startX, screenY: startY }, '*');
                } catch (err) {}
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                try {
                    window.parent.postMessage({ type: 'iphone_widget_drag_move', screenX: e.screenX, screenY: e.screenY }, '*');
                } catch (err) {}
            });

            window.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                try {
                    window.parent.postMessage({ type: 'iphone_widget_drag_end', screenX: e.screenX, screenY: e.screenY }, '*');
                } catch (err) {}
            });
        })();
    </script>
</body>

</html>
