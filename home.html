                // Базовые категории, если список пуст
                let categoriesToList = Array.from(dynamicCategories);
                if (categoriesToList.length === 0) {
                    categoriesToList = ['Утилиты', 'Развлечения', 'Соцсети', 'Продуктивность', 'Покупки', 'Другое'];
                }

                // Отрисовка карточек категорий (Pods)
                categoriesToList.forEach(catName => {
                    // Собираем все приложения из этой категории
                    const catApps = [];
                    appsArray.forEach(app => {
                        if (app.type === 'folder') {
                            (app.items || []).forEach(subItem => {
                                const matchCat = Array.isArray(subItem.category) ? subItem.category.includes(catName) : subItem.category === catName;
                                if (matchCat) catApps.push(subItem);
                            });
                        } else {
                            const matchCat = Array.isArray(app.category) ? app.category.includes(catName) : app.category === catName;
                            if (matchCat) catApps.push(app);
                        }
                    });

                    // Создаем карточку категории
                    const block = document.createElement('div');
                    block.className = 'app-library-category-block';

                    const pod = document.createElement('div');
                    pod.className = 'app-library-pod';

                    const openInNewTab = localStorage.getItem('openInNewTab') === 'true';
                    const targetAttr = openInNewTab ? 'target="_blank" rel="noopener noreferrer"' : '';

                    // 3 больших приложения (слоты 0, 1, 2)
                    const bigApps = catApps.slice(0, 3);
                    bigApps.forEach(item => {
                        const slot = document.createElement('a');
                        slot.className = 'app-library-app-slot';
                        slot.href = item.url || '#';
                        if (targetAttr) slot.setAttribute('target', '_blank');
                        slot.title = item.name;
                        slot.innerHTML = `<img src="${item.icon}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/62?text=?'">`;
                        pod.appendChild(slot);
                    });

                    // Если больших меньше 3, заполняем аккуратными пустыми слотами
                    for (let k = bigApps.length; k < 3; k++) {
                        const emptySlot = document.createElement('div');
                        emptySlot.className = 'app-library-app-slot';
                        emptySlot.style.opacity = '0.15';
                        emptySlot.innerHTML = `<div style="width: 58px; height: 58px; background: rgba(255,255,255,0.1); border-radius: 14px;"></div>`;
                        pod.appendChild(emptySlot);
                    }

                    // 4-й слот: микро-сетка из 4 маленьких иконок (оставшиеся приложения)
                    const remainingApps = catApps.slice(3);
                    const miniPod = document.createElement('div');
                    miniPod.className = 'app-library-mini-pod';
                    miniPod.title = `Открыть «${catName}»`;

                    const miniItems = remainingApps.slice(0, 4);
                    miniItems.forEach(item => {
                        const miniImg = document.createElement('img');
                        miniImg.className = 'app-library-mini-icon';
                        miniImg.src = item.icon;
                        miniImg.alt = item.name;
                        miniImg.onerror = () => { miniImg.style.opacity = '0'; };
                        miniPod.appendChild(miniImg);
                    });

                    // Заполняем пустыми если меньше 4
                    for (let m = miniItems.length; m < 4; m++) {
                        const placeholder = document.createElement('div');
                        placeholder.style.cssText = 'width: 100%; height: 100%; border-radius: 6px; background: rgba(255,255,255,0.06);';
                        miniPod.appendChild(placeholder);
                    }

                    // Клик по микро-сетке или по названию категории открывает полноэкранный вид папки (4 в ряд)
                    const openCategoryFolder = () => {
                        if (folderManager) {
                            const virtualFolder = {
                                type: 'folder',
                                name: catName,
                                items: catApps,
                                _isVirtualCategory: true
                            };
                            folderManager.open(virtualFolder, virtualFolder);
                        }
                    };

                    miniPod.onclick = openCategoryFolder;
                    pod.appendChild(miniPod);

                    // Название категории
                    const titleEl = document.createElement('div');
                    titleEl.className = 'app-library-category-title';
                    titleEl.innerText = catName;
                    titleEl.onclick = openCategoryFolder;

                    block.appendChild(pod);
                    block.appendChild(titleEl);
                    libGrid.appendChild(block);
                });

                pagesContainer.appendChild(libPageDiv);

                // Добавляем крайнюю правую иконку пагинации библиотеки приложений
                const libDot = document.createElement('div');
                libDot.className = 'dot library-dot';
                libDot.title = 'Библиотека приложений';
                libDot.style.cursor = 'pointer';
                libDot.innerHTML = `
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                    </svg>
                `;
                libDot.onclick = () => {
                    pagesContainer.scrollTo({
                        left: libPageIndex * pagesContainer.clientWidth,
                        behavior: 'smooth'
                    });
                };
                dotsContainer.appendChild(libDot);
            }

            initAppItems();
            initSortables();

            if (silent && animationController) {
                setTimeout(() => { animationController.enable(); }, 100);
            }
        }

        function initSortables() {
            sortables.forEach(s => s.destroy());
            sortables = [];

            const editMode = document.body.classList.contains('edit-mode');

            document.querySelectorAll('.app-page').forEach(page => {
                const s = Sortable.create(page, {
                    group: 'shared-apps',
                    animation: 300,
                    delay: 200,
                    delayOnTouchOnly: true,
                    disabled: !editMode,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    easing: "cubic-bezier(0.25, 1, 0.5, 1)",
                    swapThreshold: 0.5,
                    invertSwap: true,
                    direction: 'horizontal',
                    forceFallback: true,
                    fallbackClass: "sortable-drag",
                    fallbackOnBody: true,
                    onStart: function () {
                        if (animationController) animationController.disable();
                        document.body.style.cursor = 'grabbing';
                        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(10);
                        document.querySelectorAll('.page-nav-zone').forEach(z => z.classList.add('visible'));
                        document.addEventListener('mousemove', checkHover);
                        document.addEventListener('touchmove', checkHover);
                    },
                    onMove: function (evt) {
                        const isDraggingFolder = evt.dragged.querySelector('.folder-trigger') !== null;
                        if (isDraggingFolder) return true;
                        if (hoveredTargetEl && hoveredTargetEl === evt.related) {
                            return false;
                        }
                        return true;
                    },
                    onEnd: function (evt) {
                        document.removeEventListener('mousemove', checkHover);
                        document.removeEventListener('touchmove', checkHover);
                        document.querySelectorAll('.page-nav-zone').forEach(z => {
                            z.classList.remove('visible', 'hover');
                        });
                        if (animationController) animationController.enable();
                        document.body.style.cursor = '';

                        // Дроп иконки на капсулу категории
                        if (hoveredCategoryCapsule) {
                            const targetCategory = hoveredCategoryCapsule.dataset.categoryName || hoveredCategoryCapsule.innerText.trim();
                            hoveredCategoryCapsule.classList.remove('drop-target-capsule');
                            hoveredCategoryCapsule = null;

                            const draggedApp = evt.item._appData;
                            if (draggedApp) {
                                const currentApps = getAppsFromStorage();
                                const draggedReal = findAppInTree(currentApps, draggedApp);

                                if (draggedReal) {
                                    const parentContainer = findParentContainer(currentApps, draggedReal);
                                    if (parentContainer && parentContainer !== currentApps) {
                                        const idx = parentContainer.indexOf(draggedReal);
                                        if (idx !== -1) parentContainer.splice(idx, 1);
                                        currentApps.push(draggedReal);
                                    }

                                    if (targetCategory === 'Главная') {
                                        draggedReal.category = ['Главная'];
                                        delete draggedReal._explicitNoMain;
                                    } else {
                                        draggedReal.category = [targetCategory];
                                        delete draggedReal._explicitNoMain;
                                    }

                                    saveCurrentState(currentApps);
                                    renderAppsToDOM(currentApps);
                                    if (window.renderCategoryBar) window.renderCategoryBar();
                                    if (typeof window.showToast === 'function') {
                                        window.showToast(`Сайт «${draggedReal.name || 'Сайт'}» перемещён во вкладку «${targetCategory}»`);
                                    }
                                    return;
                                }
                            }
                        }

                        if (hoveredTargetEl) {
                            hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');

                            const draggedApp = evt.item._appData;
                            const targetApp = hoveredTargetEl._appData;

                            if (draggedApp && targetApp && draggedApp !== targetApp) {
                                const currentApps = getAppsFromStorage();
                                const draggedReal = findAppInTree(currentApps, draggedApp);
                                const targetReal = findAppInTree(currentApps, targetApp);

                                if (draggedReal && targetReal) {
                                    if (targetReal.type === 'folder' && draggedReal.type !== 'folder') {
                                        deleteAppFromState(draggedReal);
                                        if (!targetReal.items) targetReal.items = [];
                                        targetReal.items.push(draggedReal);
                                        saveCurrentState(currentApps);
                                        renderAppsToDOM(currentApps);
                                        hoveredTargetEl = null;
                                        return;
                                    }
                                    if (targetReal.type !== 'folder' && draggedReal.type !== 'folder') {
                                        const targetParent = findParentContainer(currentApps, targetReal);
                                        if (targetParent) {
                                            const targetIdx = targetParent.indexOf(targetReal);
                                            deleteAppFromState(draggedReal);
                                            deleteAppFromState(targetReal);
                                            const newFolder = {
                                                type: "folder",
                                                name: "Новая папка",
                                                items: [targetReal, draggedReal]
                                            };
                                            targetParent.splice(targetIdx, 0, newFolder);
                                            saveCurrentState(currentApps);
                                            renderAppsToDOM(currentApps);
                                            hoveredTargetEl = null;
                                            return;
                                        }
                                    }
                                }
                            }
                        }
                        hoveredTargetEl = null;
                        saveCurrentState();
                        renderAppsToDOM(getAppsFromStorage()); // Пересчитываем страницы
                    }
                });
                sortables.push(s);
            });
        }


        function findAppInTree(appsList, targetApp) {
            if (!targetApp || !appsList) return null;
            for (let app of appsList) {
                if (app === targetApp || (app.name === targetApp.name && app.url === targetApp.url && app.icon === targetApp.icon)) {
                    return app;
                }
                if (app.type === 'folder' && app.items) {
                    const found = findAppInTree(app.items, targetApp);
                    if (found) return found;
                }
            }
            return null;
        }

        function isSameApp(a, b) {
            if (!a || !b) return false;
            if (a === b) return true;
            if (a.type === 'folder' || b.type === 'folder') {
                return a.type === b.type && a.name === b.name;
            }
            if (a.name && b.name && a.name === b.name && (a.url || '') === (b.url || '')) return true;
            return false;
        }

        function findParentContainer(appsList, targetItem) {
            if (!appsList || !targetItem) return null;
            for (let app of appsList) {
                if (isSameApp(app, targetItem)) {
                    return appsList;
                }
            }
            for (let app of appsList) {
                if (app && app.type === 'folder' && Array.isArray(app.items)) {
                    const container = findParentContainer(app.items, targetItem);
                    if (container) return container;
                }
            }
            return null;
        }

        function findIndexInArray(parentArray, targetItem) {
            if (!parentArray || !targetItem) return -1;
            const refIdx = parentArray.indexOf(targetItem);
            if (refIdx !== -1) return refIdx;
            return parentArray.findIndex(a => isSameApp(a, targetItem));
        }

        function deleteAppFromState(targetApp) {
            const activeApps = (currentApps && currentApps.length > 0) ? currentApps : getAppsFromStorage();
            const removeRecursive = (list) => {
                for (let i = 0; i < list.length; i++) {
                    const app = list[i];
                    const isMatch = typeof targetApp === 'string' ? app.name === targetApp : isSameApp(app, targetApp);
                    if (isMatch) {
                        list.splice(i, 1);
                        return true;
                    }
                    if (app.type === 'folder' && app.items) {
                        if (removeRecursive(app.items)) return true;
                    }
                }
                return false;
            };
            removeRecursive(activeApps);
            saveCurrentState(activeApps);
            renderAppsToDOM(activeApps);
        }

        function saveCurrentState(updatedApps = null) {
            if (window._isApplyingCloudSync) {
                return;
            }
            let appsToSave;
            if (updatedApps) {
                appsToSave = updatedApps;
                currentApps = updatedApps;
            } else {
                const activeApps = (currentApps && currentApps.length > 0) ? currentApps : getAppsFromStorage();
                const items = document.querySelectorAll('.pages-container .app-item');
                
                const renderedInOrder = [];
                items.forEach(item => {
                    if (item._appData) {
                        renderedInOrder.push(item._appData);
                    }
                });

                if (renderedInOrder.length > 0) {
                    const containerMap = new Map();

                    renderedInOrder.forEach(appObj => {
                        const parentArray = findParentContainer(activeApps, appObj);
                        if (parentArray) {
                            if (!containerMap.has(parentArray)) {
                                containerMap.set(parentArray, []);
                            }
                            containerMap.get(parentArray).push(appObj);
                        }
                    });

                    containerMap.forEach((subRenderedList, parentArray) => {
                        const originalIndices = [];
                        subRenderedList.forEach(appObj => {
                            const idx = findIndexInArray(parentArray, appObj);
                            if (idx !== -1) {
                                originalIndices.push(idx);
                            }
                        });

                        const sortedIndices = [...originalIndices].sort((a, b) => a - b);

                        const realObjects = subRenderedList.map(appObj => {
                            const idx = findIndexInArray(parentArray, appObj);
                            return idx !== -1 ? parentArray[idx] : appObj;
                        });

                        let count = 0;
                        realObjects.forEach(realObj => {
                            if (count < sortedIndices.length) {
                                parentArray[sortedIndices[count++]] = realObj;
                            }
                        });
                    });
                }
                appsToSave = activeApps;
            }

            if (appsToSave) {
                appsToSave = deduplicateApps(appsToSave);
                currentApps = appsToSave;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appsToSave));
                if (window.VersionManager) {
                    window.VersionManager.autoSnapshot(appsToSave);
                }
                if (window.dbApi && window.auth && window.auth.currentUser) {
                    window.dbApi.saveApps(appsToSave);
                }
            }
        }
        window.getAppsFromStorage = getAppsFromStorage;
        window.renderAppsToDOM = renderAppsToDOM;
        window.saveCurrentState = saveCurrentState;

        // --- ЗАПУСК ИЗ КЕША ---
        const cachedData = localStorage.getItem(STORAGE_KEY);
        if (cachedData) {
            try {
                const parsed = JSON.parse(cachedData);
                renderAppsToDOM(parsed);
            } catch (e) { renderAppsToDOM(DEFAULT_APPS); }
        } else { renderAppsToDOM(DEFAULT_APPS); }
        if (window.renderCategoryBar) window.renderCategoryBar();

        // Если включен режим макета, стартуем с 1-й страницы (главный экран приложений, а виджеты слева)
        if (document.body.classList.contains('iphone-mockup-enabled')) {
            requestAnimationFrame(() => {
                const pc = document.getElementById('pagesContainer');
                if (pc) pc.scrollLeft = pc.clientWidth;
            });
        }

        // --- UI & EVENTS ---
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 5) {
                header.style.background = "rgba(40, 40, 40, 0.25)";
                header.style.backdropFilter = "blur(25px) saturate(180%)";
                header.style.webkitBackdropFilter = "blur(25px) saturate(180%)";
                header.style.borderBottom = "0.5px solid rgba(255,255,255,0.15)";
            } else {
                header.style.background = "rgba(0, 0, 0, 0)";
                header.style.backdropFilter = "blur(0px)";
                header.style.webkitBackdropFilter = "blur(0px)";
                header.style.borderBottom = "none";
            }
        });

        const pagesContainer = document.getElementById('pagesContainer');
        pagesContainer.addEventListener('scroll', () => {
            const pageWidth = pagesContainer.clientWidth || 1;
            const index = Math.round(pagesContainer.scrollLeft / pageWidth);
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            const isMockup = document.body.classList.contains('iphone-mockup-enabled');
            if (isMockup) {
                if (index === 0) {
                    document.body.classList.add('on-widgets-page');
                } else {
                    document.body.classList.remove('on-widgets-page');
                }
            }
        });

        // Поддержка прокрутки колесиком мыши (горизонтально)
        let wheelTimeout;
        pagesContainer.addEventListener('wheel', (e) => {
            const isMockup = document.body.classList.contains('iphone-mockup-enabled');
            const pageWidth = pagesContainer.clientWidth || 1;
            const currentIndex = Math.round(pagesContainer.scrollLeft / pageWidth);
            const totalPages = pagesContainer.children.length;

            // Если находимся на странице виджетов
            if (isMockup && currentIndex === 0) {
                // Любой скролл вправо или вниз возвращает на экран приложений
                if (e.deltaX > 8 || e.deltaY > 8) {
                    pagesContainer.scrollTo({
                        left: 1 * pageWidth,
                        behavior: 'smooth'
                    });
                }
                return;
            }

            // Если находимся на последней странице (Библиотека приложений)
            const isLibPage = isMockup && currentIndex === totalPages - 1;
            if (isLibPage) {
                // Если горизонтальный свайп влево (вернуться на главный экран)
                if (e.deltaX < -15 || (e.shiftKey && e.deltaY < -15)) {
                    pagesContainer.scrollTo({
                        left: (totalPages - 2) * pageWidth,
                        behavior: 'smooth'
                    });
                    e.preventDefault();
                }
                // Иначе позволяем прокручивать библиотеку приложений вертикально
                return;
            }

            const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            if (Math.abs(delta) > 5) {
                e.preventDefault();

                // Накапливаем прокрутку для переключения страниц
                const direction = delta > 0 ? 1 : -1;
                const nextIndex = Math.max(0, Math.min(currentIndex + direction, totalPages - 1));

                clearTimeout(wheelTimeout);
                wheelTimeout = setTimeout(() => {
                    pagesContainer.scrollTo({
                        left: nextIndex * pageWidth,
                        behavior: 'smooth'
                    });
                }, 50);
            }
        }, { passive: false });

        // Прием сообщений от iframe виджетов при свайпе/прокрутке вправо
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'iphone_navigate_page') {
                const pageWidth = pagesContainer.clientWidth || 1;
                const totalPages = pagesContainer.children.length;
                const currentIndex = Math.round(pagesContainer.scrollLeft / pageWidth);
                const nextIndex = Math.max(0, Math.min(currentIndex + (e.data.direction || 1), totalPages - 1));
                pagesContainer.scrollTo({
                    left: nextIndex * pageWidth,
                    behavior: 'smooth'
                });
            }
        });

        // --- СВАЙП МЫШЬЮ МЕЖДУ СТРАНИЦАМИ (DRAG / SWIPE КУРСОРОМ КАК НА ТЕЛЕФОНЕ) ---
        (function initPageMouseSwipe() {
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let startScrollLeft = 0;
            let dragStartTime = 0;
            let hasMoved = false;
            let widgetFrame = null;

            const pagesWrapper = document.querySelector('.pages-wrapper');
            const pagesContainer = document.getElementById('pagesContainer');
            if (!pagesContainer) return;

            function onMouseDown(e) {
                // Только левая кнопка мыши
                if (e.button !== 0) return;
                // Не свайпать при режиме редактирования (перемещение иконок)
                if (document.body.classList.contains('edit-mode')) return;

                // Игнорируем клики по иконкам, кнопкам, инпутам и открытым папкам
                if (e.target.closest('.icon-container') ||
                    e.target.closest('.action-btn') ||
                    e.target.closest('button') ||
                    e.target.closest('input') ||
                    e.target.closest('textarea') ||
                    e.target.closest('.folder-overlay.active') ||
                    e.target.closest('.sidebar-overlay.active')) {
                    return;
                }

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startScrollLeft = pagesContainer.scrollLeft;
                dragStartTime = performance.now();
                hasMoved = false;
                widgetFrame = document.querySelector('.iphone-widgets-frame');

                window.addEventListener('mousemove', onMouseMove, { passive: false });
                window.addEventListener('mouseup', onMouseUp, { once: true });
            }

            function onMouseMove(e) {
                if (!isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                if (!hasMoved) {
                    // Если пользователь скроллит вертикально внутри библиотеки приложений
                    const inLib = e.target.closest('.app-library-page');
                    if (inLib && Math.abs(dy) > Math.abs(dx) * 1.3 && Math.abs(dy) > 6) {
                        isDragging = false;
                        cleanup();
                        return;
                    }

                    if (Math.abs(dx) > 5) {
                        hasMoved = true;
                        pagesContainer.style.scrollSnapType = 'none';
                        pagesContainer.style.scrollBehavior = 'auto';
                        document.body.style.cursor = 'grabbing';
                        document.body.style.userSelect = 'none';
                        if (widgetFrame) widgetFrame.style.pointerEvents = 'none';
                    }
                }

                if (hasMoved) {
                    e.preventDefault();
                    pagesContainer.scrollLeft = startScrollLeft - dx;
                }
            }

            function onMouseUp(e) {
                if (!isDragging) return;
                isDragging = false;
                cleanup();

                if (hasMoved) {
                    const dx = e.clientX - startX;
                    const dt = performance.now() - dragStartTime;
                    const velocity = dx / Math.max(dt, 1);
                    const pageWidth = pagesContainer.clientWidth || 1;
                    const currentIndex = Math.round(startScrollLeft / pageWidth);
                    const totalPages = pagesContainer.children.length;

                    let targetIndex = currentIndex;

                    // Быстрый свайп или смещение больше 18% ширины страницы
                    if (velocity < -0.22 || dx < -pageWidth * 0.18) {
                        targetIndex = Math.min(currentIndex + 1, totalPages - 1);
                    } else if (velocity > 0.22 || dx > pageWidth * 0.18) {
                        targetIndex = Math.max(0, currentIndex - 1);
                    } else {
                        targetIndex = Math.round(pagesContainer.scrollLeft / pageWidth);
                        targetIndex = Math.max(0, Math.min(targetIndex, totalPages - 1));
                    }

                    pagesContainer.style.scrollSnapType = '';
                    pagesContainer.style.scrollBehavior = 'smooth';
                    pagesContainer.scrollTo({
                        left: targetIndex * pageWidth,
                        behavior: 'smooth'
                    });

                    // Подавляем случайный клик после завершения перетаскивания
                    const blockClick = (ev) => {
                        ev.stopPropagation();
                        ev.preventDefault();
                        window.removeEventListener('click', blockClick, true);
                    };
                    window.addEventListener('click', blockClick, true);
                    setTimeout(() => window.removeEventListener('click', blockClick, true), 120);
                } else {
                    pagesContainer.style.scrollSnapType = '';
                    pagesContainer.style.scrollBehavior = 'smooth';
                }
            }

            function cleanup() {
                window.removeEventListener('mousemove', onMouseMove);
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (widgetFrame) widgetFrame.style.pointerEvents = '';
            }

            pagesContainer.addEventListener('mousedown', onMouseDown);
            if (pagesWrapper) pagesWrapper.addEventListener('mousedown', onMouseDown);
            const iphoneScreen = document.querySelector('.iphone-screen');
            if (iphoneScreen) iphoneScreen.addEventListener('mousedown', onMouseDown);
        })();

        // Мы не используем один animationController для всего, 
        // так как структура стала сложнее. Можно добавить на каждую страницу в renderAppsToDOM.
        let animationController = { disable: () => { }, enable: () => { } };

        let hoveredTargetEl = null;
        let hoveredNavZone = null;
        let hoveredCategoryCapsule = null;
        let navScrollTimeout = null;

        const checkHover = (e) => {
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

            if (!clientX || !clientY) return;

            const dragEl = document.querySelector('.sortable-drag');
            let originalPointerEvents = '';
            if (dragEl) {
                originalPointerEvents = dragEl.style.pointerEvents;
                dragEl.style.pointerEvents = 'none';
            }

            const target = document.elementFromPoint(clientX, clientY);
            if (dragEl) dragEl.style.pointerEvents = originalPointerEvents;

            // 1. Проверка наведения на капсулу категории
            const categoryCapsule = target?.closest('.category-capsule');
            if (categoryCapsule) {
                if (hoveredCategoryCapsule !== categoryCapsule) {
                    if (hoveredCategoryCapsule) hoveredCategoryCapsule.classList.remove('drop-target-capsule');
                    hoveredCategoryCapsule = categoryCapsule;
                    hoveredCategoryCapsule.classList.add('drop-target-capsule');
                }
                if (hoveredTargetEl) {
                    hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');
                    hoveredTargetEl = null;
                }
                return;
            } else {
                if (hoveredCategoryCapsule) {
                    hoveredCategoryCapsule.classList.remove('drop-target-capsule');
                    hoveredCategoryCapsule = null;
                }
            }

            // Проверка зон навигации по страницам
            const navZone = target?.closest('.page-nav-zone');
            if (navZone) {
                if (hoveredNavZone !== navZone) {
                    if (hoveredNavZone) hoveredNavZone.classList.remove('hover');
                    hoveredNavZone = navZone;
                    hoveredNavZone.classList.add('hover');

                    clearTimeout(navScrollTimeout);
                    navScrollTimeout = setTimeout(() => {
                        const direction = hoveredNavZone.classList.contains('right') ? 1 : -1;
                        const pagesContainer = document.getElementById('pagesContainer');
                        const pageWidth = pagesContainer.clientWidth;
                        const currentIndex = Math.round(pagesContainer.scrollLeft / pageWidth);
                        const isMockup = document.body.classList.contains('iphone-mockup-enabled');
                        const totalPages = pagesContainer.children.length;
                        const minIndex = isMockup ? 1 : 0; // Не скроллить при перетаскивании иконки на страницу виджетов
                        const nextIndex = currentIndex + direction;

                        if (nextIndex >= minIndex && nextIndex < totalPages) {
                            pagesContainer.scrollTo({
                                left: nextIndex * pageWidth,
                                behavior: 'smooth'
                            });
                        }
                    }, 600);
                }
                if (hoveredTargetEl) {
                    hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');
                    hoveredTargetEl = null;
                }
                return;
            }

            if (hoveredNavZone) {
                hoveredNavZone.classList.remove('hover');
                hoveredNavZone = null;
                clearTimeout(navScrollTimeout);
            }

            const itemEl = target?.closest('.app-item');
            if (!itemEl) {
                if (hoveredTargetEl) {
                    hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');
                    hoveredTargetEl = null;
                }
                return;
            }

            const isTargetFolder = itemEl.querySelector('.folder-trigger') !== null;
            const isDraggingFolder = dragEl?.querySelector('.folder-trigger') !== null;
            const isDragged = itemEl === dragEl || itemEl?.classList.contains('sortable-ghost');

            if (itemEl && !isDraggingFolder && !isDragged) {
                const rect = itemEl.getBoundingClientRect();
                const bufferX = rect.width * 0.25;
                const bufferY = rect.height * 0.15;

                const isInsideBuffer = (
                    clientX > rect.left + bufferX &&
                    clientX < rect.right - bufferX &&
                    clientY > rect.top + bufferY &&
                    clientY < rect.bottom - bufferY
                );

                if (isInsideBuffer) {
                    if (hoveredTargetEl !== itemEl) {
                        if (hoveredTargetEl) hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');
                        hoveredTargetEl = itemEl;
                        if (isTargetFolder) {
                            hoveredTargetEl.classList.add('drop-target');
                        } else {
                            hoveredTargetEl.classList.add('drop-target-icon');
                        }
                    }
                    return;
                }
            }

            if (hoveredTargetEl) {
                hoveredTargetEl.classList.remove('drop-target', 'drop-target-icon');
                hoveredTargetEl = null;
            }
        };
        function initAppItems() {
            const appItems = document.querySelectorAll('.app-item');
            appItems.forEach(item => {
                const iconContainer = item.querySelector('.icon-container');
                const link = item.querySelector('a');

                // Удаление кнопки, если была (чтобы не дублировать при перерисовке)
                const existingBtn = iconContainer.querySelector('.delete-btn');
                if (existingBtn) existingBtn.remove();

                // --- ЛОГИКА УДАЛЕНИЯ ---
                const isFolder = item.querySelector('.folder-trigger') !== null;
                const btnDel = iconContainer.querySelector('.btn-del');
                if (btnDel) {
                    btnDel.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        const nameEl = item.querySelector('.app-name');
                        const name = nameEl ? nameEl.innerText : (isFolder ? 'Папка' : 'Приложение');
                        const appData = item._appData;

                        if (isFolder) {
                            confirmModal.show(name, 'folder', {
                                onConfirm: () => {
                                    deleteAppFromState(appData || name);
                                },
                                onUngroup: () => {
                                    const currentApps = getAppsFromStorage();
                                    const folderIdx = currentApps.findIndex(a => (appData ? a === appData : a.name === name) && a.type === 'folder');

                                    if (folderIdx !== -1) {
                                        const folder = currentApps[folderIdx];
                                        const items = folder.items || [];
                                        currentApps.splice(folderIdx, 1);
                                        currentApps.splice(folderIdx, 0, ...items);
                                        saveCurrentState(currentApps);
                                        renderAppsToDOM(currentApps);
                                    }
                                }
                            });
                        } else {
                            confirmModal.show(name, 'site', () => {
                                deleteAppFromState(appData || name);
                            });
                        }
                    };
                }

                // --- ЛОГИКА РЕДАКТИРОВАНИЯ (Кнопка Карандаш) ---
                const btnEdit = iconContainer.querySelector('.btn-edit');
                if (btnEdit) {
                    btnEdit.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        const currentApps = getAppsFromStorage();
                        const absIndex = parseInt(item.dataset.absIndex);
                        const appData = item._appData || currentApps[absIndex];

                        if (appData) {
                            iconEditor.open((newData) => {
                                const freshApps = getAppsFromStorage();
                                const targetApp = findAppInTree(freshApps, appData) || appData;
                                Object.assign(targetApp, newData);
                                saveCurrentState(freshApps);
                                renderAppsToDOM(freshApps);
                            }, appData, window.userCategories);
                        }
                    };
                }

                // --- ТРИГГЕР РЕЖИМА РЕДАКТИРОВАНИЯ ---
                let longPressTimer;
                const isTouch = () => !window.matchMedia('(pointer: fine)').matches;

                const startPress = () => {
                    // На телефоне при удержании, на ПК - только по ПКМ (пропускаем mousedown удержание)
                    if (!isTouch()) return;

                    longPressTimer = setTimeout(() => {
                        window.enableEditMode();
                        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(50);
                    }, 600);
                };
                const cancelPress = () => clearTimeout(longPressTimer);

                item.addEventListener('touchstart', startPress, { passive: true });
                item.addEventListener('touchend', cancelPress, { passive: true });
                item.addEventListener('touchmove', cancelPress, { passive: true });

                // Mousedown удержание убираем для ПК, т.к. только ПКМ
                // item.addEventListener('mousedown', (e) => { if (e.button === 0) startPress(); });

                item.addEventListener('mouseup', cancelPress);
                item.addEventListener('mouseleave', cancelPress);

                if (link) {
                    link.onclick = (e) => {
                        if (document.body.classList.contains('edit-mode')) { e.preventDefault(); }
                    };
                }
            });
        }

        let lastEditActivation = 0;
        window.enableEditMode = function () {
            document.body.classList.add('edit-mode');
            sortables.forEach(s => s.option("disabled", false));
            lastEditActivation = Date.now();
        }
        window.disableEditMode = function () {
            document.body.classList.remove('edit-mode');
            sortables.forEach(s => s.option("disabled", true));
        }

        // Глобальный перехват контекстного меню для режима редактирования
        document.addEventListener('contextmenu', (e) => {
            const hasCursor = window.matchMedia('(pointer: fine)').matches;
            const item = e.target.closest('.app-item');

            // Если клик/долгое нажатие было по иконке
            if (item) {
                e.preventDefault(); // Всегда отменяем стандартное меню для иконок

                // На ПК сразу включаем режим редактирования (на мобильных это делает таймер touchstart)
                if (hasCursor) {
                    window.enableEditMode();
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.folder-overlay')) return;
            // Если режим редактирования только что включился, не закрываем его по этому же клику
            if (Date.now() - lastEditActivation < 300) return;

            if (!e.target.closest('.app-item') && !e.target.closest('.btn-del') && !e.target.closest('.menu-btn') && !e.target.closest('.widget-btn') && !e.target.closest('.sidebar') && !e.target.closest('.widget-sidebar') && !e.target.closest('.add-btn') && !e.target.closest('.editor-overlay')) {
                window.disableEditMode();
            }
        });

        // --- ИНИЦИАЛИЗАЦИЯ FolderManager (Вставьте это!) ---
        folderManager = new FolderManager({
            getApps: getAppsFromStorage,
            saveApps: (newApps) => saveCurrentState(newApps),
            renderMain: renderAppsToDOM,
            iconEditor: iconEditor,
            confirmModal: confirmModal
        });

        // --- ИНИЦИАЛИЗАЦИЯ TOAST ---
        function showToast(text, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');

            toastText.innerText = text;
            if (isError) toast.classList.add('toast-error');
            else toast.classList.remove('toast-error');

            container.classList.add('active');
            setTimeout(() => {
                container.classList.remove('active');
            }, 3000);
        }

        // --- ИНИЦИАЛИЗАЦИЯ МЕНЕДЖЕРА БОКОВОГО МЕНЮ (из sidebar.js) ---
        window.sidebarManager = initSidebarManager({
            iconEditor,
            wallpaperManager,
            getAppsFromStorage,
            renderAppsToDOM,
            saveCurrentState,
            onLayoutChange: () => {
                const pagesContainer = document.getElementById('pagesContainer');
                const pageWidth = pagesContainer.clientWidth || 1;
                const currentIndex = Math.round(pagesContainer.scrollLeft / pageWidth);

                renderAppsToDOM(getAppsFromStorage());

                // Восстанавливаем страницу после перерисовки
                setTimeout(() => {
                    const newPageWidth = pagesContainer.clientWidth || 1;
                    pagesContainer.scrollLeft = currentIndex * newPageWidth;
                }, 0);
            },
            defaultApps: DEFAULT_APPS,
            confirmModal,
            showToast
        });

        // --- ИНИЦИАЛИЗАЦИЯ ВИДЖЕТ-БАР (ЛЕВЫЙ) ---
        const widgetBtn = document.getElementById('widgetBtn');
        const widgetSidebar = document.getElementById('widgetSidebar');
        const widgetSidebarOverlay = document.getElementById('widgetSidebarOverlay');
        const closeWidgetBtn = document.getElementById('closeWidgetBtn');

        function openWidgetMenu() {
            widgetSidebar.classList.add('active');
            widgetSidebarOverlay.classList.add('active');
            document.body.classList.add('widget-sidebar-open');
            document.body.style.overflow = 'hidden';
        }

        // --- BACKGROUND WIDGET LOADING ---
        // Загружаем виджеты через секунду после загрузки страницы, 
        // чтобы они не мешали основной отрисовке, но были готовы к открытию.
        window.addEventListener('load', () => {
            setTimeout(() => {
                const iframe = document.getElementById('dashboardIframe');
                if (iframe && !iframe.src) {
                    iframe.src = iframe.dataset.src;
                }
            }, 1000);
        });

        window.closeWidgetMenu = function () {
            widgetSidebar.classList.remove('active');
            widgetSidebarOverlay.classList.remove('active');
            document.body.classList.remove('widget-sidebar-open');
            document.body.style.overflow = '';
        }

        widgetBtn.addEventListener('click', openWidgetMenu);
        if (closeWidgetBtn) closeWidgetBtn.addEventListener('click', closeWidgetMenu);
        widgetSidebarOverlay.addEventListener('click', closeWidgetMenu);

        // --- TWITCH OAUTH GLOBAL HANDLER ---
        (function handleTwitchOAuth() {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token=')) {
                // Прячем меню виджетов если оно было открыто
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get('access_token');

                if (token) {
                    localStorage.setItem('twitch_access_token', token);
                    // Очищаем хэш из адресной строки чтобы было красиво
                    window.history.replaceState(null, '', window.location.pathname + window.location.search);

                    // Сразу открываем сайдбар с виджетами, чтобы было видно результат
                    setTimeout(() => {
                        openWidgetMenu();
                        // Перезагружаем iframe виджета для верности
                        const iframe = document.getElementById('dashboardIframe');
                        if (iframe) {
                            iframe.src = iframe.dataset.src || iframe.src;
                        }
                    }, 500);
                }
            }
        })();

        // --- AUTH & SYNC ---
        const waitForAuth = setInterval(() => {
            if (window.auth) {
                clearInterval(waitForAuth);
                window.auth.onAuthStateChanged(async (user) => {
                    // Обновляем сайдбар при смене пользователя
                    sidebarManager.refreshSidebar();

                    if (user) {
                        console.log("User logged in:", user.uid);

                        await wallpaperManager.loadFromCloud();

                        if (window.dbApi) {
                            const cloudSettings = await window.dbApi.loadSettings();
                            if (cloudSettings) {
                                // Загрузка Стекла
                                if (typeof cloudSettings.glassEffect !== 'undefined') {
                                    const isGlass = cloudSettings.glassEffect;
                                    if (isGlass) document.body.classList.add('glass-mode');
                                    else document.body.classList.remove('glass-mode');
                                    localStorage.setItem('glassEffect', isGlass.toString());

                                    // Обновляем UI чекбокса, если он сейчас отрендерен
                                    const toggle = document.getElementById('globalGlassToggle');
                                    if (toggle) toggle.checked = isGlass;
                                }





                                // Загрузка Расширенных папок
                                if (typeof cloudSettings.expandedFolders !== 'undefined') {
                                    const isExpanded = cloudSettings.expandedFolders;
                                    if (isExpanded) document.body.classList.add('expanded-folders');
                                    else document.body.classList.remove('expanded-folders');
                                    localStorage.setItem('expandedFolders', isExpanded.toString());

                                    // Обновляем UI чекбокса, если он сейчас отрендерен
                                    const toggle = document.getElementById('expandedFoldersToggle');
                                    if (toggle) toggle.checked = isExpanded;
                                }

                                // Загрузка Показать факты/цитаты
                                if (typeof cloudSettings.showFactsWidget !== 'undefined') {
                                    const showFacts = cloudSettings.showFactsWidget;
                                    localStorage.setItem('showFactsWidget', showFacts.toString());
                                    if (showFacts) document.body.classList.add('show-facts-widget-enabled');
                                    else document.body.classList.remove('show-facts-widget-enabled');

                                    const toggle = document.getElementById('showFactsWidgetToggle');
                                    if (toggle) toggle.checked = showFacts;
                                }

                                // Загрузка Колонок
                                if (typeof cloudSettings.gridColumns !== 'undefined') {
                                    const cols = cloudSettings.gridColumns;
                                    document.documentElement.style.setProperty('--grid-cols', cols);
                                    localStorage.setItem('gridColumns', cols);

                                    const slider = document.getElementById('colCountSlider');
                                    const valDisplay = document.getElementById('colCountValue');
                                    if (slider) slider.value = cols;
                                    if (valDisplay) valDisplay.innerText = cols;
                                }

                                // Загрузка Рядов
                                if (typeof cloudSettings.gridRows !== 'undefined') {
                                    const rows = cloudSettings.gridRows;
                                    localStorage.setItem('gridRows', rows);

                                    const slider = document.getElementById('rowCountSlider');
                                    const valDisplay = document.getElementById('rowCountValue');
                                    if (slider) slider.value = rows;
                                    if (valDisplay) valDisplay.innerText = rows;
                                }

                                renderAppsToDOM(getAppsFromStorage());
                            }
                        }

                        if (window.dbApi) {
                            if (window.dbApi.migrateApps) {
                                await window.dbApi.migrateApps();
                            }

                            if (window.VersionManager && window.VersionManager.loadFromCloud) {
                                await window.VersionManager.loadFromCloud();
                            }

                            // Реальная синхронизация подколлекции apps в реальном времени!
                            if (window.dbApi.subscribeToApps) {
                                if (window._unsubscribeAppsSync) window._unsubscribeAppsSync();
                                window._unsubscribeAppsSync = window.dbApi.subscribeToApps((cloudApps) => {
                                    if (cloudApps && Array.isArray(cloudApps)) {
                                        const currentLocal = localStorage.getItem(STORAGE_KEY);
                                        const cloudSerialized = JSON.stringify(cloudApps);

                                        if (cloudSerialized !== currentLocal) {
                                            console.log("[RealtimeSync] Получены изменения из облака:", cloudApps.length, "элементов.");
                                            window._isApplyingCloudSync = true;

                                            renderAppsToDOM(cloudApps, true);
                                            localStorage.setItem(STORAGE_KEY, cloudSerialized);

                                            if (window.VersionManager) {
                                                window.VersionManager.autoSnapshot(cloudApps);
                                            }

                                            setTimeout(() => {
                                                window._isApplyingCloudSync = false;
                                            }, 500);
                                        }
                                    }
                                });
                            }

                            // Реальная синхронизация категорий и настроек версий в реальном времени!
                            if (window.dbApi.subscribeToUserDoc) {
                                if (window._unsubscribeUserDocSync) window._unsubscribeUserDocSync();
                                window._unsubscribeUserDocSync = window.dbApi.subscribeToUserDoc((userData) => {
                                    if (userData) {
                                        if (userData.categories && Array.isArray(userData.categories)) {
                                            window.userCategories = userData.categories;
                                            localStorage.setItem('userCategories', JSON.stringify(userData.categories));
                                            if (window.renderCategoryBar) window.renderCategoryBar();
                                        }
                                        if (userData.versionHistory && window.VersionManager) {
                                            const local = window.VersionManager.getLocalVersions();
                                            if (JSON.stringify(userData.versionHistory) !== JSON.stringify(local)) {
                                                window.VersionManager.saveLocalVersions(userData.versionHistory);
                                                if (window.renderVersionHistoryUI) {
                                                    window.renderVersionHistoryUI();
                                                }
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    } else {
                        console.log("User logged out");
                        if (window._unsubscribeAppsSync) { window._unsubscribeAppsSync(); window._unsubscribeAppsSync = null; }
                        if (window._unsubscribeUserDocSync) { window._unsubscribeUserDocSync(); window._unsubscribeUserDocSync = null; }
                        renderAppsToDOM(DEFAULT_APPS);
                        localStorage.removeItem(STORAGE_KEY);

                        const todoIframe = document.getElementById('todoIframe');
                        if (todoIframe) todoIframe.src = '';

                        if (window.renderCategoryBar) window.renderCategoryBar();
                    }
                });
            }
        }, 100);

        // Пересчет сетки при изменении размера экрана (для адаптивности)
        let lastWidth = window.innerWidth;
        let lastHeight = window.innerHeight;
        window.addEventListener('resize', () => {
            if (
                (lastWidth > 600 && window.innerWidth <= 600) ||
                (lastWidth <= 600 && window.innerWidth > 600) ||
                (window.innerWidth <= 600 && Math.abs(window.innerHeight - lastHeight) > 30)
            ) {
                renderAppsToDOM(getAppsFromStorage());
            }
            lastWidth = window.innerWidth;
            lastHeight = window.innerHeight;
        });

        // Закрытие меню во фрейме закладок при клике вне его
        document.addEventListener('click', () => {
            const iframe = document.getElementById('hbIframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'closeMenus' }, '*');
            }
        }, true);

        // --- ДЕСКТОПНЫЙ ВИДЖЕТ ИНТЕРЕСНЫХ ФАКТОВ (ЛОГИКА) ---
        let currentFactIndex = -1;
        let lastDisplayedHour = -1;

        function updateHourlyFactWidget(customFactObj) {
            const widget = document.getElementById('desktopFactWidget');
            const iconEl = document.getElementById('factWidgetIcon');
            const titleEl = document.getElementById('factWidgetTitle');
            const contentEl = document.getElementById('factWidgetContent');

            if (!widget || typeof getFactForCurrentHour !== 'function') return;

            const currentHour = Math.floor(Date.now() / 3600000);
            let fact;

            if (customFactObj) {
                fact = customFactObj.fact;
                currentFactIndex = customFactObj.index;
            } else {
                if (lastDisplayedHour === currentHour && currentFactIndex !== -1) {
                    return;
                }
                lastDisplayedHour = currentHour;
                currentFactIndex = currentHour % HOURLY_FACTS.length;
                fact = HOURLY_FACTS[currentFactIndex];
            }

            if (!fact) return;

            const typeIcons = {
                'word': '📖',
                'quote': '✍️',
                'joke': '🎭',
                'fact': '💡',
                'english_word': '🧠',
                'english_phrase': '💬',
                'english_idiom': '🇬🇧',
                'book_quote': '📖',
                'movie_quote': '🎬',
                'country_fact': '🌍',
                'space_fact': '🚀',
                'animal_fact': '🐘',
                'lifehack': '💡',
                'shortcut': '⌨️',
                'history_fact': '📜',
                'science_fact': '🔬',
                'finance_fact': '💰',
                'design_tip': '🎨',
                'programming_fact': '💻',
                'russian_word': '📚',
                'foreign_word': '🗣️',
                'riddle': '🤔',
                'brain_teaser': '🧩',
                'on_this_day': '📅',
                'did_you_know': '⚡'
            };
            const icon = typeIcons[fact.type] || '💡';

            // Эффект красивого затухания и смены контента
            widget.classList.add('fade-out');

            setTimeout(() => {
                iconEl.textContent = icon;
                titleEl.textContent = fact.title || 'Интересное';
                contentEl.textContent = fact.text;
                widget.classList.remove('fade-out');
            }, 400);
        }

        function initFactWidget() {
            updateHourlyFactWidget();
            setInterval(updateHourlyFactWidget, 60000);

            const refreshBtn = document.getElementById('factWidgetRefresh');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (typeof getRandomFact === 'function') {
                        const newFactObj = getRandomFact(currentFactIndex);
                        updateHourlyFactWidget(newFactObj);
                    }
                });
            }
        }

        // Запуск инициализации при загрузке
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initFactWidget);
        } else {
            initFactWidget();
        }

    </script>
</body>
